#[[ BUILD BAN macOS MA KHONG CAN CO MAY MAC.
#
#   PyInstaller KHONG build cheo duoc: no nhet chinh trinh thong dich Python
#   va cac thu vien NHI PHAN cua may dang chay vao goi. Khong co duong vong —
#   ke ca Docker hay Wine. Nen ban .app bat buoc phai dung mot may macOS.
#
#   GitHub Actions cho muon may do. Kho AutoToneandRetouch la Public nen so
#   phut chay KHONG GIOI HAN va khong mat tien, ke ca may macOS.
#
#   CHAY: vao tab Actions tren GitHub -> "Build ban macOS" -> Run workflow.
#   Xong thi tai file .zip o muc Artifacts cua lan chay do.
#]]
name: Build bản macOS

on:
  workflow_dispatch:
    inputs:
      khong_khoa:
        description: "Bản thử, không khoá bản quyền (để trống = bản bán)"
        type: boolean
        default: false
      khong_retouch:
        description: "Bỏ hẳn phần retouch khỏi gói"
        type: boolean
        default: false

jobs:
  dong-goi:
    #[[ macos-14 la Apple Silicon (arm64). Goi ra chay tren may M1/M2/M3...
    #   May Intel doi macos-13. Xem ghi chu o buoc "Dong goi" ben duoi. ]]
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      #[[ ChuyenSangMac/ bi .gitignore chan (co y: tranh hai ban ma nguon tren
      #   kho). Nen build tu ma nguon GOC o thu muc chinh — no la ban that,
      #   con ban Mac chi la ban chep. ]]
      - name: Lấy phần retouch (kho riêng, Private)
        if: ${{ !inputs.khong_retouch }}
        uses: actions/checkout@v4
        with:
          repository: bunbuon/ToolCloneEvoto
          token: ${{ secrets.TOOL_RETOUCH_TOKEN }}
          path: ToolCloneEvoto

      #[[ DUNG CHINH BAN PYTHON MA CAI_DAT_MAC.command DA CHUNG MINH.
      #
      #   Bon lan truoc that bai vi toi tu dung moi truong thay vi dung cach
      #   da co san. Moi cach deu vo o mot cho khac nhau:
      #
      #     setup-python    symlink ve Python framework -> PyInstaller doc moi
      #                     truong khong co cv2
      #     python3 runner  Homebrew chan pip: externally-managed-environment
      #     venv tu Homebrew moi truong dung roi, nhung Python 3.14 cua
      #                     Homebrew KHONG kem tkinter -> goi build ra mo len
      #                     la "No module named tkinter"
      #
      #   CAI_DAT_MAC.command da giai xong bai nay tu truoc, va ghi ro ly do:
      #   Python cua may mang Tk 8.5, tren macOS doi moi giao dien vo chu va o
      #   nhap khong an chuot — luc build KHONG bao loi gi, chi mo app moi
      #   thay. Ban python-build-standalone mang san Tcl/Tk 8.6.
      #
      #   Nen dung dung ban do. Cung phien ban voi file cai tay, de goi build
      #   tren Actions va goi build tren may that giong het nhau.
      #]]
      - name: Tải Python kèm Tk 8.6 (như CAI_DAT_MAC.command)
        run: |
          BAN_PY="3.12.11"
          MOC="20250723"
          KT="aarch64"       # macos-14 la Apple Silicon
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/${MOC}/cpython-${BAN_PY}+${MOC}-${KT}-apple-darwin-install_only.tar.gz"
          echo "Tải: $URL"
          curl -fsSL "$URL" -o python.tar.gz
          tar -xzf python.tar.gz
          echo "PY=$PWD/python/bin/python3" >> "$GITHUB_ENV"

      - name: Cài thư viện
        run: |
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install pyinstaller pillow numpy opencv-python-headless
          #[[ Kiem NGAY rang ba thu quyet dinh deu nam dung cho, truoc khi
          #   build. Bon lan chay truoc deu phai suy luan tu log gian tiep. ]]
          echo "=== kiểm trước khi build ==="
          "$PY" -c "import sys, cv2, tkinter; print('prefix :', sys.prefix); print('cv2    :', cv2.__version__); print('tk     :', tkinter.TkVersion)"

      - name: Đóng gói
        run: |
          THEM="--nhe"
          if [ "${{ inputs.khong_khoa }}" = "true" ]; then
            THEM="$THEM --khong-khoa"
          fi
          if [ "${{ inputs.khong_retouch }}" = "true" ]; then
            THEM="$THEM --khong-retouch"
          else
            THEM="$THEM --tool-retouch $PWD/ToolCloneEvoto"
          fi
          #[[ PHAI goi DUNG ban Python da cai thu vien.
          #
          #   Tren runner macOS, `python` tro vao Python HE THONG
          #   (/Library/Frameworks/...), khong phai ban setup-python vua cai
          #   cv2. dong_goi.py goi PyInstaller bang sys.executable, nen no se
          #   dong goi tu moi truong KHONG CO cv2 — build van "thanh cong",
          #   chi la goi ra co cv2 hong.
          #
          #   Hong that 21/09: lan chay dau bao "cv2 hong (ImportError)" o buoc
          #   kiem goi, trong khi pip bao da cai cv2 xong xuoi.
          #]]
          echo "Lệnh: $PY dong_goi.py $THEM"
          "$PY" dong_goi.py $THEM

      #[[ Bai kiem tu no bao goi co dat khong. Khong chay no thi ta chi biet
      #   "build xong", ma build xong van co the ra mot goi mo len la sap. ]]
      - name: Kiểm gói
        run: '"$PY" kiem_goi.py dist/AutoTone.app'

      - name: Xem có gì trong gói
        run: |
          echo "=== kích thước ==="
          du -sh dist/AutoTone.app
          echo "=== bí mật có lọt không (phải trống) ==="
          grep -rl "AutoTone-SAY-Media-bq-" dist/ 2>/dev/null || echo "  sạch"
          find dist -name "cap_key*" -o -name "quan_ly_key*" 2>/dev/null || true

      - name: Gửi gói ra
        uses: actions/upload-artifact@v4
        with:
          name: AutoTone-macOS
          #[[ Nhan ca .zip lan .tar.gz: nen_goi() dung `ditto` (ra .zip) nhung
          #   LUI VE tar neu may khong co ditto. Chi khai .zip thi truong hop
          #   do se gui ra mot goi rong ma khong bao gi. ]]
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
