#[[ BUILD BAN macOS MA KHONG CAN CO MAY MAC.
#
#   PyInstaller KHONG build cheo duoc: no nhet chinh trinh thong dich Python
#   va cac thu vien NHI PHAN cua may dang chay vao goi. Khong co duong vong —
#   ke ca Docker hay Wine. Nen ban .app bat buoc phai dung mot may macOS.
#
#   GitHub Actions cho muon may do. Kho AutoToneandRetouch la Public nen so
#   phut chay KHONG GIOI HAN va khong mat tien, ke ca may macOS.
#
#   CHAY: vao tab Actions tren GitHub -> "Build ban macOS" -> Run workflow.
#   Xong thi tai file .zip o muc Artifacts cua lan chay do.
#]]
name: Build bản macOS

on:
  workflow_dispatch:
    inputs:
      khong_khoa:
        description: "Bản thử, không khoá bản quyền (để trống = bản bán)"
        type: boolean
        default: false
      khong_retouch:
        description: "Bỏ hẳn phần retouch khỏi gói"
        type: boolean
        default: false
      #[[ BAO MAT MAC DINH BAT (--bao-mat). O nay chi de GO LOI: tat bao mat thi
      #   ban .app ra se CON MA NGUON .py doc duoc — KHONG duoc giao khach. Dung
      #   no khi can build nhanh de thu mot thay doi, khong phai ban phat hanh. ]]
      khong_bao_mat:
        description: "GỠ LỖI: bỏ mã hoá (bản ra có mã nguồn — KHÔNG giao khách)"
        type: boolean
        default: false
      #[[ 10/10: user chay ban Apple Silicon tren Mac CHIP INTEL -> "Bad CPU type
      #   in executable". PyInstaller khong build universal2 duoc voi torch /
      #   onnxruntime (khong co wheel universal2) -> moi loai mot lan build. ]]
      loai_mac:
        description: "Loại Mac: Apple Silicon (M1/M2/M3/M4) hay Intel"
        type: choice
        options:
          - apple-silicon
          - intel
        default: apple-silicon

jobs:
  dong-goi:
    #[[ macos-14 la Apple Silicon (arm64). Goi ra chay tren may M1/M2/M3...
    #   May Intel doi macos-13. Xem ghi chu o buoc "Dong goi" ben duoi. ]]
    #[[ Intel: macos-15-intel (x86_64 — anh Intel cuoi cung cua GitHub, macos-13
    #   da nghi 12/2025). ]]
    runs-on: ${{ inputs.loai_mac == 'intel' && 'macos-15-intel' || 'macos-14' }}
    timeout-minutes: 120

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      #[[ ChuyenSangMac/ bi .gitignore chan (co y: tranh hai ban ma nguon tren
      #   kho). Nen build tu ma nguon GOC o thu muc chinh — no la ban that,
      #   con ban Mac chi la ban chep. ]]
      - name: Lấy phần retouch (kho riêng, Private)
        if: ${{ !inputs.khong_retouch }}
        uses: actions/checkout@v4
        with:
          repository: bunbuon/ToolCloneEvoto
          token: ${{ secrets.TOOL_RETOUCH_TOKEN }}
          path: ToolCloneEvoto

      #[[ DUNG CHINH BAN PYTHON MA CAI_DAT_MAC.command DA CHUNG MINH.
      #
      #   Bon lan truoc that bai vi toi tu dung moi truong thay vi dung cach
      #   da co san. Moi cach deu vo o mot cho khac nhau:
      #
      #     setup-python    symlink ve Python framework -> PyInstaller doc moi
      #                     truong khong co cv2
      #     python3 runner  Homebrew chan pip: externally-managed-environment
      #     venv tu Homebrew moi truong dung roi, nhung Python 3.14 cua
      #                     Homebrew KHONG kem tkinter -> goi build ra mo len
      #                     la "No module named tkinter"
      #
      #   CAI_DAT_MAC.command da giai xong bai nay tu truoc, va ghi ro ly do:
      #   Python cua may mang Tk 8.5, tren macOS doi moi giao dien vo chu va o
      #   nhap khong an chuot — luc build KHONG bao loi gi, chi mo app moi
      #   thay. Ban python-build-standalone mang san Tcl/Tk 8.6.
      #
      #   Nen dung dung ban do. Cung phien ban voi file cai tay, de goi build
      #   tren Actions va goi build tren may that giong het nhau.
      #]]
      - name: Tải Python kèm Tk 8.6 (như CAI_DAT_MAC.command)
        run: |
          BAN_PY="3.12.11"
          MOC="20250723"
          KT="aarch64"       # macos-14 la Apple Silicon
          if [ "${{ inputs.loai_mac }}" = "intel" ]; then KT="x86_64"; fi
          echo "Máy build: $(uname -m) · Python: $KT"
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/${MOC}/cpython-${BAN_PY}+${MOC}-${KT}-apple-darwin-install_only.tar.gz"
          echo "Tải: $URL"
          curl -fsSL "$URL" -o python.tar.gz
          tar -xzf python.tar.gz
          echo "PY=$PWD/python/bin/python3" >> "$GITHUB_ENV"

      - name: Cài thư viện
        run: |
          "$PY" -m pip install --upgrade pip
          #[[ MAC INTEL (10/10): PyTorch NGUNG ra wheel macOS x86_64 tu 2.3 -> ban
          #   cuoi 2.2.2, dich voi numpy 1.x (numpy 2 lam torch.from_numpy hong).
          #   onnxruntime x86_64 macOS cuoi la 1.23.2. Ghim bang PIP_CONSTRAINT de
          #   MOI lenh pip ben duoi (ke ca phu thuoc cua insightface / mediapipe)
          #   khong keo numpy 2 len. Tra PyPI 10/10: torch 2.2.2 / numpy 1.26.4 /
          #   onnxruntime 1.23.2 / onnx 1.22 (universal2) / mediapipe 0.10.14 /
          #   opencv 4.11.0.86 deu co wheel cp312 macOS x86_64. ]]
          if [ "${{ inputs.loai_mac }}" = "intel" ]; then
            printf '%s\n' "numpy==1.26.4" "torch==2.2.2" "onnxruntime==1.23.2" > "$RUNNER_TEMP/rang_buoc_intel.txt"
            echo "PIP_CONSTRAINT=$RUNNER_TEMP/rang_buoc_intel.txt" >> "$GITHUB_ENV"
            export PIP_CONSTRAINT="$RUNNER_TEMP/rang_buoc_intel.txt"
            "$PY" -m pip install "numpy==1.26.4"
            ORT="onnxruntime==1.23.2"
          else
            ORT="onnxruntime==1.29.0"
          fi
          #[[ GHIM opencv-python==4.11.0.86 TREN macOS — KHONG de pip lay 5.0.
          #
          #   LOI THAT (4/10, bản .app bao mat dau tien tren Actions): goi chay
          #   len bao, o buoc kiem goi:
          #       ImportError: ERROR: recursion is detected during loading of
          #       "cv2" binary extensions
          #   va face_detector() tra ve None. cv2 nap TOT luc build (5.0.0), chi
          #   hong SAU khi dong goi thanh .app.
          #
          #   Nguyen nhan (da tra tan goc): opencv-python 5.0.0.93 (nhanh major
          #   5.0, ra 7/2026, rat moi) chua on dinh voi PyInstaller tren macOS.
          #   Loader cv2 trong .app tim cv2.abi3.so sai cho -> import lai cv2
          #   -> bootstrap() thay co OpenCV_LOADER -> nem recursion. KHONG phai
          #   do --collect-all (da bo dung tren mac), cung KHONG phai headless
          #   (headless cung cung loader, cung loi). Cach sua dang tin: dung
          #   nhanh 4.x da duoc hook-cv2.py kiem thu ky — 4.11.0.86 co cung wheel
          #   tag macosx_13_0_arm64 nhu 5.0, on dinh voi PyInstaller 6.x.
          #
          #   KHONG --strip (PyInstaller #9463: --strip hong cv2/numpy tren CI).
          #   dong_goi.lenh() khong truyen --strip -> an toan.
          #
          #   Ban Windows van dung 5.0.0 va KHONG sao (bo cuc onedir khong di doi
          #   file .py nhu .app) — nen chi ghim rieng cho macOS o day. ]]
          "$PY" -m pip install pyinstaller pillow numpy "opencv-python==4.11.0.86"
          #[[ hooks-contrib moi nhat: hook-cv2.py la noi xu ly cv2 (khong phai
          #   PyInstaller core). Ban moi vá nhieu ca cv2/macOS. ]]
          "$PY" -m pip install -U pyinstaller-hooks-contrib
          #[[ BAO MAT: Cython de dich loi + saytool sang .so TREN CHINH MAY MAC
          #   (khong build cheo duoc — day la cho DUY NHAT kiem duoc .so Mac).
          #   macos-14 co clang san (Xcode CLT), khong phai cai them trinh dich. ]]
          if [ "${{ inputs.khong_bao_mat }}" != "true" ]; then
            "$PY" -m pip install cython
          fi
          #[[ torch: BAY GIO NHOI VAO GOI (--torch-trong-goi), khong con --nhe.
          #
          #   Truoc day --nhe LOAI torch khoi goi, torch o day chi de self-check
          #   nap model luc dong_goi_bao_mat. Gio nguoi dung muon "dong goi chung
          #   het vao 1 ban cai": Retouch phai hien du 8 tinh nang NGAY, khong tai
          #   gi. Nen torch phai CO trong moi truong build de --collect-all torch
          #   gom vao goi. Ban Mac cua pip la CPU+MPS (khong CUDA — Mac khong co
          #   CUDA), chay duoc moi may Mac; co GPU Apple thi thiet_bi.chon() tu
          #   dung MPS. Bo torch khi --khong-retouch (goi khong co phan retouch).
          #]]
          if [ "${{ inputs.khong_retouch }}" != "true" ]; then
            "$PY" -m pip install torch || echo "  [!] torch khong cai duoc — goi se THIEU torch, Retouch hong"
          fi
          #[[ BO THU VIEN RETOUCH Y HET BAN WINDOWS (6/10 — user: "them tat ca roi
          #   build thanh 1 ban nhu windows").
          #
          #   Truoc day goi Mac CHI co torch: khong insightface (nhan mat + diem
          #   moc), khong onnxruntime (phan vung da), khong mediapipe (dang nguoi,
          #   keo dai chan) — dong_goi bao "bo --collect-all ...: khong co trong
          #   moi truong build" va kiem_goi van DAT. Tren may that moi tinh nang
          #   can diem moc mat se lang le khong doi gi.
          #
          #   Ghim DUNG phien ban goi Windows (venv_build). mediapipe cai --no-deps:
          #   no doi opencv-contrib-python (de len cv2 4.11 da ghim o tren — dung
          #   loi recursion cv2 trong .app) va jax/jaxlib (dong_goi --exclude-module
          #   jax, ban Windows cung khong mang). Cai tay cac goi con lai. ]]
          if [ "${{ inputs.khong_retouch }}" != "true" ]; then
            "$PY" -m pip install "protobuf==4.25.9" "onnx==1.22.0" "$ORT" \
              "insightface==1.0.1" "opencv-python==4.11.0.86"
            "$PY" -m pip install --no-deps "mediapipe==0.10.14"
            "$PY" -m pip install absl-py attrs flatbuffers matplotlib sounddevice "protobuf==4.25.9"
          fi
          #[[ Kiem NGAY rang ba thu quyet dinh deu nam dung cho, truoc khi
          #   build. Bon lan chay truoc deu phai suy luan tu log gian tiep. ]]
          echo "=== kiểm trước khi build ==="
          "$PY" -c "import platform, numpy; print('máy    :', platform.machine()); print('numpy  :', numpy.__version__)"
          if [ "${{ inputs.loai_mac }}" = "intel" ]; then
            "$PY" -c "import platform; assert platform.machine() == 'x86_64', 'Python khong phai x86_64: ' + platform.machine()" \
              || { echo "DỪNG: bản Intel mà Python không phải x86_64."; exit 1; }
          fi
          "$PY" -c "import sys, cv2, tkinter; print('prefix :', sys.prefix); print('cv2    :', cv2.__version__); print('tk     :', tkinter.TkVersion)"
          #[[ torch nay PHAI co (nhoi vao goi). Co retouch ma thieu torch thi goi
          #   ra se hong phan Retouch — chan ngay, dung build ra ban hong. ]]
          if [ "${{ inputs.khong_retouch }}" != "true" ]; then
            "$PY" -c "import torch; print('torch  :', torch.__version__, '· MPS', torch.backends.mps.is_available())" \
              || { echo "DỪNG: torch không import được mà gói cần torch."; exit 1; }
            "$PY" -c "import onnxruntime as o, onnx, insightface, mediapipe, cv2; from insightface.app import FaceAnalysis; from mediapipe.python.solutions import pose; print('onnxrt :', o.__version__, o.get_available_providers()); print('onnx   :', onnx.__version__); print('insightface:', insightface.__version__); print('mediapipe  :', mediapipe.__version__); assert cv2.__version__.startswith('4.11'), 'cv2 bi doi sang ' + cv2.__version__" \
              || { echo "DỪNG: thiếu thư viện retouch (insightface / onnxruntime / mediapipe) hoặc cv2 bị đổi."; exit 1; }
            if "$PY" -m pip show opencv-contrib-python >/dev/null 2>&1; then
              echo "DỪNG: opencv-contrib-python lọt vào — sẽ đè cv2 4.11 đã ghim."; exit 1
            fi
          fi
          if [ "${{ inputs.khong_bao_mat }}" != "true" ]; then
            "$PY" -c "import Cython; print('cython :', Cython.__version__)"
            "$PY" -c "import shutil,sys; print('clang  :', shutil.which('clang') or 'KHONG CO — build .so se hong')"
          fi

      #[[ MO HINH RETOUCH Y HET BAN WINDOWS. dong_goi.py lay resnet34_faceparse
      #   + yunet tu ~/.cache/skin_spike va buffalo_l tu ~/.insightface — tren may
      #   build Windows chung co san, may Actions thi chua (log cu: "Chua co san:
      #   resnet34_faceparse.onnx, face_detection_yunet_2023mar.onnx, buffalo_l").
      #   Tai tu dung nguon saytool / insightface tu tai, roi DOI CHIEU SHA-256 voi
      #   dung tep goi Windows dang mang — khac la dung, khong dong goi mo hinh la.
      #   Tep .sha256 de ngoai thu muc mo hinh (dong_goi chep CA thu muc buffalo_l). ]]
      - name: Tải mô hình retouch (như bản Windows)
        if: ${{ !inputs.khong_retouch }}
        run: |
          KHO="$HOME/.cache/skin_spike"
          IFD="$HOME/.insightface/models/buffalo_l"
          mkdir -p "$KHO" "$IFD"
          curl -fsSL "https://github.com/yakhyo/face-parsing/releases/download/weights/resnet34.onnx" \
            -o "$KHO/resnet34_faceparse.onnx"
          cp models/face_detection_yunet_2023mar.onnx "$KHO/"
          curl -fsSL "https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip" \
            -o "$RUNNER_TEMP/buffalo_l.zip"
          TAM="$(mktemp -d)"
          unzip -q "$RUNNER_TEMP/buffalo_l.zip" -d "$TAM"
          find "$TAM" -name "*.onnx" -exec cp {} "$IFD/" \;
          rm -rf "$TAM" "$RUNNER_TEMP/buffalo_l.zip"
          printf '%s  %s\n' \
            5b805bba7b5660ab7070b5a381dcf75e5b3e04199f1e9387232a77a00095102e resnet34_faceparse.onnx \
            8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4 face_detection_yunet_2023mar.onnx \
            > "$RUNNER_TEMP/kho.sha256"
          printf '%s  %s\n' \
            df5c06b8a0c12e422b2ed8947b8869faa4105387f199c477af038aa01f9a45cc 1k3d68.onnx \
            f001b856447c413801ef5c42091ed0cd516fcd21f2d6b79635b1e733a7109dbf 2d106det.onnx \
            5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91 det_10g.onnx \
            4fde69b1c810857b88c64a335084f1c3fe8f01246c9a191b48c7bb756d6652fb genderage.onnx \
            4c06341c33c2ca1f86781dab0e829f88ad5b64be9fba56e56bc9ebdefc619e43 w600k_r50.onnx \
            > "$RUNNER_TEMP/buffalo.sha256"
          ( cd "$KHO" && shasum -a 256 -c "$RUNNER_TEMP/kho.sha256" )
          ( cd "$IFD" && shasum -a 256 -c "$RUNNER_TEMP/buffalo.sha256" )
          ls -l "$KHO" "$IFD"

      - name: Đóng gói
        run: |
          #[[ --torch-trong-goi: nhoi torch (+ thu vien nang) vao goi de Retouch
          #   hien du 8 tinh nang ngay, khong tai gi. Thay cho --nhe cu (tai sau).
          #   Khong retouch thi khong can torch -> ve --nhe cho goi gon. ]]
          if [ "${{ inputs.khong_retouch }}" = "true" ]; then
            THEM="--nhe"
          else
            THEM="--torch-trong-goi"
          fi
          if [ "${{ inputs.khong_khoa }}" = "true" ]; then
            THEM="$THEM --khong-khoa"
          fi
          if [ "${{ inputs.khong_retouch }}" = "true" ]; then
            THEM="$THEM --khong-retouch"
          else
            THEM="$THEM --tool-retouch $PWD/ToolCloneEvoto"
          fi
          #[[ BAO MAT MAC DINH: --bao-mat tru khi tick khong_bao_mat. Co retouch
          #   thi so anh bang bo_thuc de chac ban .so cho ket qua y het tool goc. ]]
          if [ "${{ inputs.khong_bao_mat }}" != "true" ]; then
            THEM="$THEM --bao-mat"
            if [ "${{ inputs.khong_retouch }}" != "true" ] && [ -d "$PWD/ToolCloneEvoto/bo_thuc" ]; then
              THEM="$THEM --so-anh $PWD/ToolCloneEvoto/bo_thuc"
            fi
          fi
          #[[ ICON: dong_goi --icon neu repo co icon macOS. Quy uoc: dat file
          #   icon.icns o GOC repo. Khong co thi dung icon mac dinh (khong loi). ]]
          if [ -f "$PWD/icon.icns" ]; then
            THEM="$THEM --icon $PWD/icon.icns"
          fi
          #[[ PHAI goi DUNG ban Python da cai thu vien.
          #
          #   Tren runner macOS, `python` tro vao Python HE THONG
          #   (/Library/Frameworks/...), khong phai ban setup-python vua cai
          #   cv2. dong_goi.py goi PyInstaller bang sys.executable, nen no se
          #   dong goi tu moi truong KHONG CO cv2 — build van "thanh cong",
          #   chi la goi ra co cv2 hong.
          #
          #   Hong that 21/09: lan chay dau bao "cv2 hong (ImportError)" o buoc
          #   kiem goi, trong khi pip bao da cai cv2 xong xuoi.
          #]]
          echo "Lệnh: $PY dong_goi.py $THEM"
          "$PY" dong_goi.py $THEM

      #[[ macOS dong THU MUC dist/AutoTone (KHONG .app) — xem dong_goi.lenh
      #   mac_thu_muc. .app bundle lam cv2 recursion khong sua duoc (da thu pin
      #   version, collect-binaries, runtime hook, copy tay .so/.dylibs: .so +
      #   config day du MA van recursion vi symlink Frameworks<->Resources). Thu
      #   muc phang thi cv2 nam canh nhau nhu Windows -> het recursion. ]]
      - name: Kiểm gói
        run: '"$PY" kiem_goi.py dist/AutoTone'

      #[[ kiem_goi chi kiem buoc retouch NAP DUOC. Bai nay chay XEM TRUOC that
      #   (AutoTone --say-xem, dung duong giao dien) tren t1.jpg — anh nhom 4 mat
      #   di kem goi insightface: phai nhan mat bang insightface CO diem moc, bat
      #   het thanh thi anh doi, khong buoc nao bi bo qua. ]]
      - name: Thử xem trước retouch trên ảnh có mặt
        if: ${{ !inputs.khong_retouch }}
        timeout-minutes: 20
        run: |
          ANH="$("$PY" -c "import insightface, os; print(os.path.join(os.path.dirname(insightface.__file__), 'data', 'images', 't1.jpg'))")"
          "$PY" kiem_xem_goi.py dist/AutoTone "$ANH"

      #[[ MO APP THAT bang chinh launcher giao khach (6/10 — user mo .command ma
      #   khong thay app). kiem_goi / kiem_xem_goi chay cac cua tu kiem, KHONG mo
      #   giao dien. Buoc nay chay "Mo Tone&Retouch.command" y nhu nguoi dung:
      #   app phai con song sau 20 giay (launcher tu kiem), khong thi in nhat ky
      #   va DUNG build. Du lieu app vao thu muc tam. ]]
      - name: Thử mở app như người dùng (launcher .command)
        timeout-minutes: 5
        run: |
          L="dist/AutoTone/_thu_mo.command"
          tr -d '\r' < mac/mo_tone_retouch.command > "$L"
          chmod +x "$L"
          set +e
          AUTOTONE_DATA="$(mktemp -d)" bash "$L"
          KQ=$?
          set -e
          pkill -f "dist/AutoTone/AutoTone" || true
          echo "--- nhật ký app ---"
          tail -n 40 "$HOME/Library/Logs/Tone-Retouch.log" || true
          rm -f "$L"
          exit $KQ

      - name: Xem có gì trong gói
        run: |
          echo "=== kích thước ==="
          du -sh dist/AutoTone
          echo "=== bí mật có lọt không (phải trống) ==="
          grep -rl "AutoTone-SAY-Media-bq-" dist/ 2>/dev/null || echo "  sạch"
          find dist -name "cap_key*" -o -name "quan_ly_key*" 2>/dev/null || true

      #[[ CHAN build neu BAO MAT ma loi/saytool VAN con .py doc duoc. Mot ban
      #   ma hoa am tham khong chay (vd thieu trinh dich) ma van ra goi la kieu
      #   hong te nhat: tuong da giau code, thuc ra giao ca ma nguon. Bat o day. ]]
      - name: Chặn nếu còn mã nguồn (chỉ khi bảo mật)
        if: ${{ !inputs.khong_bao_mat }}
        run: |
          R="dist/AutoTone/_internal"
          LOI=0
          echo "=== lõi phải là .so, KHÔNG được còn .py/.pyc ==="
          for m in autotone retouch khoa ban_quyen thu_gu learn_corrections giao_dien autotone_gui; do
            if [ "${{ inputs.khong_retouch }}" = "true" ] && [ "$m" = "retouch" ]; then continue; fi
            so=$(find "$R" -name "$m*.so" 2>/dev/null | head -1)
            py=$(find "$R" \( -name "$m.py" -o -name "$m.pyc" \) 2>/dev/null | head -1)
            if [ -z "$so" ]; then echo "  [!] THIẾU $m.so (lõi chưa mã hoá?)"; LOI=1
            elif [ -n "$py" ]; then echo "  [!] CÒN mã nguồn: $py"; LOI=1
            else echo "  [ok] $m -> $(basename "$so")"; fi
          done
          if [ "${{ inputs.khong_retouch }}" != "true" ]; then
            echo "=== saytool chỉ được còn 4 vỏ .py (__init__/cli/duong_dan + có thể __main__) ==="
            la=$(find "$R" -path "*/saytool/*.py" ! -name "__init__.py" ! -name "cli.py" ! -name "duong_dan.py" ! -name "__main__.py" 2>/dev/null)
            if [ -n "$la" ]; then echo "  [!] saytool CÒN .py lạ (chưa mã hoá):"; echo "$la"; LOI=1
            else echo "  [ok] saytool sạch"; fi
          fi
          if [ "$LOI" != "0" ]; then
            echo "DỪNG: bản bảo mật mà còn mã nguồn đọc được — KHÔNG phát hành."
            exit 1
          fi
          echo "Gói bảo mật đạt: lõi + saytool đều là mã máy."

      #[[ TAO .dmg tu THU MUC dist/AutoTone (khong .app — xem Kiem goi).
      #
      #   Vi la thu muc chu khong phai .app double-click, dong them mot launcher
      #   "Mo Tone&Retouch.command": double-click no chay binary AutoTone trong
      #   thu muc, an cua so Terminal sau khi mo app. Nguoi dung keo ca thu muc
      #   "Tone&Retouch" vao Applications (hoac dau cung), roi bam .command de mo.
      #
      #   Chua ky (code signing) nen lan dau mo may hien "unidentified developer":
      #   chuot phai -> Open. Muon het canh bao can Apple Developer ID. ]]
      - name: Tạo .dmg (file cài đặt)
        run: |
          GOI="dist/AutoTone"
          [ -d "$GOI" ] || { echo "Khong thay $GOI"; exit 1; }
          STAGE="$(mktemp -d)"
          #[[ Thu muc hien thi ten "Tone&Retouch" trong .dmg (ten ky thuat binary
          #   van la AutoTone ben trong). ]]
          APPDIR="$STAGE/Tone&Retouch"
          cp -R "$GOI" "$APPDIR"
          #[[ Launcher .command: tep THAT trong kho (mac/mo_tone_retouch.command),
          #   khong con viet bang printf. 6/10 — user: mo .command chi thay "Qua
          #   trinh da hoan thanh", khong thay app: ban cu day moi dau ra vao
          #   /dev/null roi thoat ngay -> app hong / bi macOS chan khong de lai dau
          #   vet. Ban moi go co cach ly, chay nohup, ghi nhat ky
          #   ~/Library/Logs/Tone-Retouch.log, app thoat ngay thi in loi ra. Bo \r
          #   phong khi tep bi doi xuong dong Windows (bash bao "bad interpreter"). ]]
          LAUNCHER="$APPDIR/Mở Tone&Retouch.command"
          tr -d '\r' < mac/mo_tone_retouch.command > "$LAUNCHER"
          chmod +x "$LAUNCHER"
          tr -d '\r' < mac/huong_dan_mo.txt > "$APPDIR/Đọc trước khi mở.txt"
          chmod +x "$APPDIR/AutoTone" 2>/dev/null || true
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          if [ "${{ inputs.loai_mac }}" = "intel" ]; then
            DMG="dist/Tone-Retouch-macOS-Intel.dmg"
          else
            DMG="dist/Tone-Retouch-macOS-AppleSilicon.dmg"
          fi
          rm -f "$DMG"
          hdiutil create -volname "Tone&Retouch" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          rm -rf "$STAGE"
          echo "=== .dmg da tao ==="
          ls -lh "$DMG"

      - name: Gửi gói ra
        uses: actions/upload-artifact@v4
        with:
          name: AutoTone-macOS-${{ inputs.loai_mac == 'intel' && 'Intel' || 'AppleSilicon' }}
          #[[ .dmg la file cai chinh. Van kem .zip/.tar.gz lam ban du phong
          #   (nen_goi dung ditto ra .zip, lui ve tar neu thieu ditto). ]]
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
